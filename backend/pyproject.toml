[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiranrohith", email = "kiranrohith246@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=4.0",
    "docling>=2.138.0",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.5",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "onnxruntime>=1.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
