[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiranrohith", email = "kiranrohith246@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=4.0",
    "docling>=2.138.0",
    "fastapi[standard]>=0.143.0",
    "fpdf2>=2.8.9",
    "jinja2>=3.1.6",
    "langchain>=1.4.5",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "onnxruntime>=1.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    # Docling needs these; named here so the Linux image can take their CPU-only builds (see [tool.uv.sources] below)
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["kit: runs the seed kit through the real matcher on a throwaway database (pytest -m kit)"]
addopts = "-m 'not kit'"

# The Linux image has no GPU: take PyTorch from its CPU-only index there (the default PyPI build drags in ~2 GB of CUDA
# libraries). Windows and macOS builds from PyPI are already CPU-only, so development is unchanged.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
